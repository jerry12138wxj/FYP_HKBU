model: mel_roformer_denoise
task: denoise
status: ready_to_train
data:
  dataset: DNS-Challenge / Valentini
  root: 02_databases
  split_policy: by_song (never by_segment)
  train_split: train 90 songs (100 minus the 10 held-out)
  valid_split: 10 held-out songs taken from train (whole songs, never segments)
  test_split: official test 50 songs — evaluated exactly once, at the end
  leakage_guard: set(train_songs) & set(valid_songs) == empty AND valid_songs & test_songs == empty
  anti_pattern: 绝不用 test 做验证集（那与 DPRNN 的 train-as-valid 是同一类错误，只是方向相反）
  segment_s: 8.0
  batch_size: 2
  num_workers: 4
  sampling: 'random offset within song (energy-gated: skip first 30 s silence in MUSDB)'
loss:
  terms:
  - name: l1_wave
    weight: 1.0
    domain: waveform
  - name: l1_spec
    weight: 0.5
    domain: spectral (same STFT as init card)
    note: 降噪=时域 L1 + 频域 L1（任务书规则）
  reduction: mean over batch and samples
  multi_output_align: 按 keys 对齐，不按位置（防止 masker 静默互换）
optim:
  name: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  grad_clip_norm: 5.0
  note: 大模型/难训模型 lr 更小、warmup 更长
schedule:
  type: cosine
  warmup_steps: 1000
  min_lr_ratio: 0.05
  epochs: 20
amp:
  enabled: true
  dtype: bfloat16
  grad_accum_steps: 4
  note: 8 GiB 显存：大模型靠梯度累积，不靠加大 batch
checkpoint:
  dir: D:/FYP_HKBU_runs/mel_roformer_denoise/checkpoints
  save_best: best.pt (valid loss, 每个 epoch)
  save_last: last.pt (每 N step)
  keep_last_n: 3
  eval_with: best.pt only — 报告测试集指标时不得用 last.pt
overfit_test:
  n_items: 10
  steps: 200
  batch_size: 2
  pass_criterion: train loss 下降到初始值的 <10%，且重建音频无爆音/静音
commands:
  overfit: python tools/train_<arch>.py --config configs/train_mel_roformer_denoise.yaml --overfit 10 --steps 200
  train: python tools/train_<arch>.py --config configs/train_mel_roformer_denoise.yaml
  test: python tools/benchmark_model_universal.py --model mel_roformer_denoise --subset test --out-tag rerun
artifacts:
  checkpoints: D:/FYP_HKBU_runs/mel_roformer_denoise/checkpoints
  tensorboard: D:/FYP_HKBU_runs/mel_roformer_denoise/tb
  metrics: D:/FYP_HKBU_runs/mel_roformer_denoise/metrics.json
  audio: D:/FYP_HKBU_runs/mel_roformer_denoise/audio/<song>/
archive_fields:
- model
- config_sha256
- weight_init_sha256
- git_commit
- dataset_manifest_sha256
- seed
- steps
- best_valid_loss
- test_metrics
- command
- started_at
- finished_at
